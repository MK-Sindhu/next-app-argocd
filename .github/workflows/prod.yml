name: Continuous Deployment

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Docker login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with: 
          context: .
          push: true
          tags: mksindhu/argocd:${{ github.sha }}
      
      - name: clone repo and update manifest.yml
        env:
          PAT: ${{ secrets.PAT }}
        
        run: |
          git clone https://github.com/MK-Sindhu/argo-deployment

          sed -i "s|image: mksindhu/argocd:.*|image: mksindhu/argocd:${{ github.sha }}|g" argo-deployment/manifest.yml

          git config user.name "git actions bot"
          git config user.email "git.actions.bot@example.com"
          git add .
          git commit -m "Update manifest.yml with new image version"
          git push https://{ PAT}@github.com/MK-Sindhu/argo-deployment.git main
