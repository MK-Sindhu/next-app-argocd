name: Continuous Deployment

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Docker login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with: 
          context: .
          push: true
          tags: mksindhu/argocd:${{ github.sha }}
      
      - name: Update image tag in argo-deployment
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          git clone https://x-access-token:${PAT}@github.com/MK-Sindhu/argo-deployment.git
          cd argo-deployment

          sed -i "s|image: mksindhu/argocd:.*|image: mksindhu/argocd:${{ github.sha }}|g" manifest.yml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.yml
          git commit -m "Update manifest.yml with image ${{ github.sha }}"
          git push origin main
